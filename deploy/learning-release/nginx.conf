map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream owner_backend {
    zone owner_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server owner-auth:8000 resolve;
}
upstream lab_backend {
    zone lab_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server codelab-api:8001 resolve;
}
upstream mentor_backend {
    zone mentor_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server mentor:8103 resolve;
}
upstream notebook_backend {
    zone notebook_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server codelab-lab:8888 resolve;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    root /srv/learning;
    index index.html;
    client_max_body_size 50m;

    location = /healthz { return 200 "ok\n"; }
    location = /_owner {
        internal;
        proxy_pass http://owner_backend/owner-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location @login { return 302 /login; }
    location = /login { try_files /index.html =404; }
    location = / {
        auth_request /_owner;
        error_page 401 = @login;
        try_files /index.html =404;
    }
    location /api/auth/ { proxy_pass http://owner_backend; }

    location = /learning { return 308 /learning/; }
    location = /learning/ { return 302 /learning/paths/python-experiments; }
    location /learning/ {
        auth_request /_owner;
        error_page 401 = @login;
        try_files $uri /learning/index.html;
    }
    location = /writing { return 308 /writing/; }
    location /writing/ {
        auth_request /_owner;
        error_page 401 = @login;
        try_files /learning/index.html =404;
    }
    location = /codelab/oj { return 404; }
    location /codelab/ {
        auth_request /_owner;
        error_page 401 = @login;
        try_files $uri /codelab/index.html;
    }
    location /api/codelab/ {
        auth_request /_owner;
        proxy_pass http://lab_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
    }
    location /api/codelab/oj/ { return 404; }
    location /api/codelab/coding/ { return 404; }
    location /api/mentor/ {
        auth_request /_owner;
        proxy_pass http://mentor_backend;
        proxy_http_version 1.1;
        proxy_set_header Authorization "Bearer ${LEARNING_REVIEW_TOKEN}";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /jupyter/ {
        auth_request /_owner;
        proxy_pass http://notebook_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
    location / { try_files $uri =404; }
}
